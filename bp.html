<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>万象合参 · 项目 BP</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0a0f0a; color: #b8e8c0; font-family: 'PingFang SC', 'Noto Sans SC', sans-serif; }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      background: rgba(0,8,2,.95);
      border-bottom: 1px solid rgba(0,255,65,.18);
    }
    .bar-title {
      font-size: .88rem;
      color: #e0ffe8;
      letter-spacing: .04em;
    }
    .bar-back {
      display: inline-flex;
      align-items: center;
      padding: 7px 14px;
      border-radius: 6px;
      border: 1px solid rgba(0,255,65,.35);
      color: #80ffaa;
      text-decoration: none;
      font-size: .78rem;
      font-family: 'Courier New', monospace;
      transition: background .2s;
    }
    .bar-back:hover { background: rgba(0,255,65,.1); }
    .frame-wrap {
      height: calc(100% - 49px);
      background: #111;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    .fallback {
      display: none;
      padding: 24px;
      text-align: center;
      line-height: 1.7;
      color: #4e9460;
    }
    .fallback a { color: #80ffaa; }
  </style>
</head>
<body>
  <div class="bar">
    <div class="bar-title">万象合参 · 项目 BP</div>
    <a class="bar-back" href="index.html#projects">← 返回简历</a>
  </div>
  <div class="frame-wrap">
    <iframe
      id="bp-viewer"
      title="万象合参项目 BP 预览"
      allowfullscreen
    ></iframe>
    <div class="fallback" id="bp-fallback">
      在线预览加载失败，请
      <a id="bp-open" href="wxhc-bp.pptx" target="_blank" rel="noopener">点击此处打开</a>
      或下载后查看。
    </div>
  </div>
  <script>
    (function(){
      const pptUrl = new URL('wxhc-bp.pptx', location.href).href;
      const viewerUrl = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(pptUrl);
      const frame = document.getElementById('bp-viewer');
      const fallback = document.getElementById('bp-fallback');
      const openLink = document.getElementById('bp-open');

      openLink.href = pptUrl;
      frame.src = viewerUrl;

      frame.addEventListener('error', showFallback);
      setTimeout(function(){
        try {
          if(!frame.contentWindow) showFallback();
        } catch (_) {}
      }, 12000);

      function showFallback(){
        frame.style.display = 'none';
        fallback.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
